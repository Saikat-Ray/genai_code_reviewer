name: AI Review Feedback (Reactions)

on:
  schedule:
    # Every 4 hours. Reaction feedback isn't time-sensitive, so a slow poll is fine
    # and keeps this well within GitHub's free Actions minutes for scheduled jobs.
    - cron: '0 */4 * * *'
  workflow_dispatch: {}  # allows manual runs for testing

permissions:
  contents: read
  pull-requests: read

jobs:
  poll-reactions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll and record reactions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python -m review_bot.poll_reactions
