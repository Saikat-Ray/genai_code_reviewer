name: AI Code Review (reusable)

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'Pull request number to review'
        required: true
        type: number
      trigger_comment:
        description: 'Original comment body that triggered the review (optional)'
        required: false
        type: string
      trigger_user:
        description: 'Username who triggered the review (optional)'
        required: false
        type: string
    secrets:
      DATABASE_URL:
        required: true
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Check commenter has write access
        id: perm-check
        uses: actions/github-script@v7
        env:
          TRIGGER_USER: ${{ inputs.trigger_user }}
        with:
          script: |
            const commenter = process.env.TRIGGER_USER || (context.payload.comment && context.payload.comment.user && context.payload.comment.user.login);
            if (!commenter) {
              core.setFailed('No trigger user available (pass trigger_user input or run from an issue_comment event).');
            }
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: commenter,
            });
            const allowed = ['admin', 'write'].includes(perm.permission);
            if (!allowed) {
              core.setFailed(`@${commenter} does not have write access; skipping review.`);
            }
            core.setOutput('allowed', allowed);
            core.setOutput('commenter', commenter);

      - name: React to comment (acknowledge trigger)
        if: steps.perm-check.outputs.allowed == 'true'
        uses: actions/github-script@v7
        env:
          TRIGGER_COMMENT: ${{ inputs.trigger_comment }}
        with:
          script: |
            const commentId = context.payload.comment ? context.payload.comment.id : null;
            if (!commentId) {
              // nothing to react to (caller didn't run from issue_comment); skip
              return;
            }
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              content: 'eyes',
            });

      - name: Get PR details
        if: steps.perm-check.outputs.allowed == 'true'
        id: pr
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const prNumber = process.env.PR_NUMBER ? parseInt(process.env.PR_NUMBER, 10) : context.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('base_sha', pr.base.sha);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('pr_number', pr.number);

      - name: Checkout PR head commit
        if: steps.perm-check.outputs.allowed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0  # needed so diffing against base_sha works

      - name: Set up Python
        if: steps.perm-check.outputs.allowed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Checkout reusable repository
        if: steps.perm-check.outputs.allowed == 'true'
        uses: actions/checkout@v4
        with:
          repository: Saikat-Ray/genai_code_reviewer
          path: reviewer_repo
          # Only needed if genai_code_reviewer is PRIVATE — the default GITHUB_TOKEN
          # is scoped to the calling repo and can't check out a different private
          # repo. If genai_code_reviewer is public, this line (and the secret) can
          # be removed entirely. If private, add a fine-grained PAT with read access
          # to genai_code_reviewer as a secret (e.g. REVIEWER_REPO_TOKEN) in every
          # CALLING repo, and pass it through here.
          token: ${{ secrets.REVIEWER_REPO_TOKEN || github.token }}

      - name: Install dependencies
        if: steps.perm-check.outputs.allowed == 'true'
        run: pip install -r reviewer_repo/requirements.txt

      - name: Run AI review pipeline
        if: steps.perm-check.outputs.allowed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          TRIGGERED_BY: ${{ steps.perm-check.outputs.commenter }}
          COMMAND: ${{ inputs.trigger_comment }}
          PYTHONPATH: ${{ github.workspace }}/reviewer_repo
        run: python -m review_bot.main

      - name: Post failure notice
        if: failure() && steps.perm-check.outputs.allowed == 'true'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(process.env.ISSUE_NUMBER, 10),
              body: '⚠️ AI review failed to complete. Check the [workflow run](' +
                    `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` +
                    ') for details.',
            });